<!DOCTYPE html>
<html>
<head>
    <title>Form Elements Example</title>
</head>
<body>

    <form id="LoginForm" action="/action_page.php">
        First name:
        <input type="text" name="fname" value="Donald"><br><br>

        Last name:
        <input type="text" name="lname" value="Duck"><br><br>

        <input type="submit" value="Submit">
    </form>

    <p>
        Click the "Try it" button to display the number of elements in the form.
    </p>

    <button onclick="myFunction()">Try it</button>

    <p id="displayspace"></p>

    <script>
        function myFunction() {

            // Total number of form elements
            var x = document.getElementById("LoginForm").elements.length;

            // Value of the second form element (Last Name)
            var y = document.getElementById("LoginForm").elements[1].value;

            // Display result
            document.getElementById("displayspace").innerHTML =
                "Found " + x + " elements in the form.<br>" +
                "Second element value: " + y;

            // Creating a new paragraph using DOM
            /*
            const para = document.createElement("p");
            para.innerText = "This is a paragraph created via DOM.";
            document.body.appendChild(para);
            */
        }
    </script>

</body>
</html>

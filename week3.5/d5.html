<!DOCTYPE html>
<html>
<head>
    <title>querySelectorAll() Example</title>

    <style>
        div {
            border: 2px solid blue;
            margin-bottom: 10px;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>The Document Object</h1>

    <h2>The querySelectorAll() Method</h2>

    <p>
        Change the background color of every p element where the parent is a div element:
    </p>

    <div>
        <h3>H3 element</h3>
        <p>I am a p element, my parent is a div element.</p>
    </div>

    <div>
        <h2>H2 element</h2>
        <p>I am a p element, my parent is also a div element.</p>
    </div>

    <script>
        // Select all <p> elements that are direct children of a <div>
        const nodeList = document.querySelectorAll("div > p");

        for (let i = 0; i < nodeList.length; i++) {
            nodeList[i].style.backgroundColor = "green";
        }
    </script>

</body>
</html>
